[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openparlament"
version = "3.2.0"
description = "Demokratie-Mining für den Deutschen Bundestag – NLP-gestützte Analyse von Plenarprotokollen (25 Analysen in 6 Kategorien, v3.2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Jonas-dpp" }]
keywords = ["bundestag", "nlp", "parliament", "politics", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.1,<7.0",
    "pandas>=2.2,<4.0",
    "transformers>=4.40,<6.0",
    "torch>=2.2,<3.0",
    "streamlit>=1.36,<2.0",
    "plotly>=5.20,<8.0",
    "tqdm>=4.66,<5.0",
    "networkx>=3.2,<4.0",
    "streamlit-mermaid>=0.2.0",
    "scikit-learn>=1.3,<2.0",
    "spacy>=3.5.0,<4.0.0",
    "statsmodels>=0.14,<1.0",
    "openpyxl>=3.1,<4.0",
    "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0.tar.gz"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "flake8>=6.0,<8.0",
    "alembic>=1.13,<2.0",
]

[project.scripts]
openparlament-init      = "scripts.db_init:main"
openparlament-scrape    = "scripts.run_scraper:main"
openparlament-nlp       = "scripts.run_nlp_cli:main"
openparlament-dashboard = "scripts.run_dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
